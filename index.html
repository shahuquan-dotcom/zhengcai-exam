<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>四川省政府采购评审专家考试·智能组卷系统 沙虎全版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--accent:#2563eb;--accent-soft:#eef4ff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f6f8;--green:#16a34a;--green-soft:#f0fdf4;--red:#dc2626;--red-soft:#fef2f2}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-bottom:76px}
header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:18px;font-weight:700;line-height:1.4}
header .meta{margin-top:7px;font-size:12.5px;opacity:.94;display:flex;flex-wrap:wrap;gap:5px 14px}
.tab-bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex}
.tab-bar .tab{flex:1;text-align:center;padding:11px 0;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab-bar .tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.card{background:#fff;margin:12px;border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:15px;margin:0 0 10px;color:#111827}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.field{flex:1;min-width:130px}
.field>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
select,input[type=text]{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:14px;background:#fff;color:var(--ink)}
.btn{height:42px;border:none;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;padding:0 16px}
.btn-primary{background:var(--accent);color:#fff}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-block{width:100%}
.type-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
.type-row .nm{flex:1}
.type-row input[type=number]{width:54px;height:32px;border:1px solid var(--line);border-radius:7px;text-align:center;font-size:14px}
.total-line{font-size:13px;color:var(--muted);margin:4px 0 10px;text-align:right}
.lv-pick{display:flex;gap:6px;margin-bottom:10px}
.lv{flex:1;text-align:center;padding:7px 0;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.lv.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 14px;border:1.5px solid var(--line);border-radius:18px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.sc-check{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:12px}
.bar-line{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:13px}
.bar-line .lbl{width:118px;color:var(--muted);flex:0 0 auto}
.bar-line .track{flex:1;height:12px;background:#f0f1f3;border-radius:6px;overflow:hidden}
.bar-line .fill{height:100%;background:var(--accent)}
.notes{font-size:13px;color:#4b5563;line-height:1.7;margin:0;padding-left:18px}
.notes li{margin-bottom:6px}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
/* 试卷页 */
.paper{background:#fff;margin:12px;border-radius:12px;padding:16px}
.paper .p-head{text-align:center;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:12px}
.paper .p-title{font-size:18px;font-weight:700}
.paper .p-meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.paper .q{margin-bottom:13px;break-inside:avoid}
.paper .q-stem{font-size:15px}
.paper .q-opts{font-size:14px;margin-top:3px}
.paper .q-opts div{padding:1.5px 0}
.p-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 12px}
.p-toolbar .btn{flex:1;min-width:90px;font-size:13px}
/* 答题页 */
.timer{position:sticky;top:41px;z-index:15;background:#fff;border-bottom:1px solid var(--line);padding:9px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.timer .t{color:var(--accent)}
.timer.warn .t{color:var(--red)}
.ans-header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:14px 16px}
.ans-header h1{margin:0;font-size:16px;line-height:1.45;font-weight:700}
.ans-header .meta{margin-top:6px;font-size:12.5px;opacity:.93;display:flex;gap:5px 12px;flex-wrap:wrap}
.ans-header .meta b{font-weight:600}
.sec-h{font-weight:700;font-size:15px;margin:14px 12px 4px}
.sec-h .tip{font-weight:400;font-size:12px;color:var(--muted)}
.ans-q{background:#fff;margin:10px 12px;border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ans-q .q-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.q-no{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;background:var(--accent);color:#fff;border-radius:6px;font-size:12px;font-weight:600}
.q-diff{font-size:11px;color:#7c3aed;background:#f5f3ff;padding:1px 7px;border-radius:10px}
.badge-type{font-size:11px;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:10px;font-weight:600}
.badge-sc{font-size:10px;color:#b45309;background:#fffbeb;padding:1px 6px;border-radius:10px;border:1px solid #fde68a}
.q-stem{margin-bottom:8px;font-size:15px}
.q-opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14.5px}
.opt input{display:none}
.opt-key{flex:0 0 auto;width:21px;height:21px;border:1.5px solid #cbd5e1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#64748b;margin-top:1px}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt.sel .opt-key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.correct{background:var(--green-soft);border-color:var(--green)}
.opt.correct .opt-key{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.opt.wrong .opt-key{background:var(--red);border-color:var(--red);color:#fff}
.q-ans{display:none;margin-top:8px;font-size:13.5px;background:#fafafa;border-radius:8px;padding:9px 11px}
.q-ans .ans-line b{color:var(--green)}
.q-ans .exp{color:#4b5563;margin-top:4px}
.q-ans .src{color:#9ca3af;font-size:12px;margin-top:3px}
#result{display:none;margin:12px;background:#fff;border-radius:12px;padding:18px 16px;text-align:center}
#result .score{font-size:42px;font-weight:700;color:var(--accent);line-height:1.1}
#result .score.pass{color:var(--green)}
#result .score.fail{color:var(--red)}
#result .sub{color:var(--muted);font-size:14px;margin-top:4px}
#result .bd{display:flex;justify-content:center;gap:22px;margin-top:12px;font-size:13px}
#result .bd b{display:block;font-size:18px}
.bottom-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:20}
.bottom-bar .btn{flex:1}
/* 错题本 */
.wb-item{background:#fff;margin:10px 12px;border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.wb-item .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.wb-item .meta b{color:var(--red)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:10px 12px}
.filter select{flex:1;min-width:88px;height:34px;border:1px solid var(--line);border-radius:7px;font-size:13px;padding:0 6px}
.share-box{text-align:center}
.share-box .link{font-size:13px;color:var(--accent);word-break:break-all;background:var(--accent-soft);padding:10px;border-radius:8px;margin:10px 0}
@media print{body{background:#fff}.card,.bottom-bar,.timer,.tab-bar,.filter,.p-toolbar{display:none!important}.paper{margin:0;box-shadow:none;border-radius:0}.wrap{padding:0}}
</style>
</head>
<body>
<div class="tab-bar">
  <div class="tab on" data-tab="compose">组卷</div>
  <div class="tab" data-tab="wrong">错题本</div>
</div>

<!-- 组卷页 -->
<div id="viewCompose" class="view">
  <header>
    <h1>四川省政府采购评审专家考试<br>政采评审专家考试 · 智能组卷系统 <span style="font-size:14px;opacity:.9">沙虎全版</span></h1>
    <div class="meta" id="headMeta"></div>
  </header>
  <div class="card">
    <h2>题库结构 <span class="hint">按考试模块统计</span></h2>
    <div id="bankBars"></div>
  </div>
  <div class="card">
    <h2>组卷参数</h2>
    <div class="row">
      <div class="field" style="flex:2"><span>试卷名称</span><input type="text" id="fName" placeholder="留空则自动命名"></div>
      <div class="field"><span>考试时长</span>
        <select id="fDuration"><option value="45">45 分钟</option><option value="60">60 分钟</option><option value="90" selected>90 分钟</option><option value="120">120 分钟</option></select>
      </div>
    </div>
    <div class="field" style="margin-bottom:10px"><span>组卷策略</span>
      <select id="fStrategy"><option value="balanced" selected>均衡覆盖</option><option value="random">完全随机</option><option value="focus">重点强化</option></select>
    </div>
    <div class="sub-h" style="font-size:13px;color:var(--muted);margin:6px 0 8px">题型与分值</div>
    <div id="typeRows"></div>
    <div class="total-line">合计 <b id="sumCount">50</b> 题 · 满分 <b id="sumScore">100</b> 分</div>
    <div class="sub-h" style="font-size:13px;color:var(--muted);margin:6px 0 8px">难度等级 <span class="hint">整卷基准难度</span></div>
    <div class="lv-pick" id="lvPick"></div>
    <div class="sub-h" style="font-size:13px;color:var(--muted);margin:6px 0 8px">考试模块</div>
    <div class="chips" id="chips"></div>
    <label class="sc-check"><input type="checkbox" id="fSC" checked><span>四川专项题不少于 20%</span></label>
    <button class="btn btn-primary btn-block" id="btnGen">智能组卷 ›</button>
    <p style="font-size:12px;color:var(--muted);margin:10px 0 0">同一组参数每次生成不同试卷；系统优先避开最近两套已用题目。</p>
  </div>
  <div class="card">
    <h2>组卷与使用说明</h2>
    <ul class="notes" id="notes"></ul>
  </div>
  <div class="card">
    <h2>最近组卷</h2>
    <div id="recentList"><div class="empty">尚未组卷</div></div>
  </div>
</div>

<!-- 试卷页 -->
<div id="viewPaper" class="view" style="display:none">
  <div class="p-toolbar" id="paperToolbar"></div>
  <div class="paper" id="paperBody"></div>
</div>

<!-- 答题页 -->
<div id="viewAnswer" class="view" style="display:none">
  <div class="timer" id="timer"><span id="timerLabel">剩余时间</span><span class="t" id="timerVal">--:--</span></div>
  <div id="answerBody"></div>
  <div id="result"></div>
</div>

<!-- 错题本 -->
<div id="viewWrong" class="view" style="display:none">
  <div class="filter" id="wbFilter"></div>
  <div id="wbList"><div class="empty">交卷后，答错与未答的题自动收入错题本</div></div>
</div>

<div class="bottom-bar" id="bottomBar"></div>

,"kp":"2-12","kpn":"价格分计算","sc":0,"stem":"某货物采购项目采用综合评分法，价格分值占总分值的30%。通过符合性审查的供应商中最低报价为800万元，某供应商报价为1000万元。其价格分为：","opts":[["A","24分"],["B","30分"],["C","20分"],["D","25分"]],"ans":"A","exp":"价格分=（评标基准价÷投标报价）×价格权值×100=（800÷1000）×30%×100=24分。基准价为满足采购文件要求的最低报价。","law":"财政部令第87号"},{"id":"add2b-001","t":"single","ch":2,"mod":"M2","d":3,"kp":"2-12","kpn":"价格分计算","sc":0,"stem":"综合评分法下，货物采购项目的价格分值占总分值的比重范围是：","opts":[["A","10%—30%"],["B","30%—60%"],["C","50%—70%"],["D","20%—40%"]],"ans":"B","exp":"货物项目价格分值占总分值的比重为30%—60%，服务项目为10%—30%，防止价格权重过高或过低。","law":"财政部令第87号第55条"},{"id":"add2-002","t":"single","ch":2,"mod":"M2","d":3,"kp":"2-13","kpn":"价格扣除计算","sc":0,"stem":"某小微企业参加货物采购项目投标，报价1000万元，采购文件规定给予小微企业10%的价格扣除。其参与评审的价格为：","opts":[["A","1000万元"],["B","900万元"],["C","1100万元"],["D","950万元"]],"ans":"B","exp":"评审价=1000×（1-10%）=900万元；中标后仍按实际报价1000万元签订合同。","law":"财库〔2020〕46号、财库〔2022〕19号"},{"id":"add2-018","t":"single","ch":2,"mod":"M2","d":3,"kp":"2-16","kpn":"竞争性谈判程序","sc":0,"stem":"竞争性谈判的正确程序顺序是：","opts":[["A","成立谈判小组→谈判→制定谈判文件→确定成交供应商"],["B","制定谈判文件→成立谈判小组→谈判→确定成交供应商→最后报价"],["C","发布公告→资格审查→谈判→评标→确定成交供应商"],["D","成立谈判小组→制定谈判文件→确定邀请供应商→谈判→最后报价→确定成交供应商"]],"ans":"D","exp":"谈判应按“成立小组、制定文件、确定邀请供应商、谈判、最后报价、确定成交”的顺序进行。","law":"政府采购法第38条、财政部令第74号"},{"id":"single_049","t":"single","ch":2,"mod":"M2","d":3,"kp":"2-16","kpn":"竞争性谈判程序","sc":0,"stem":"竞争性谈判中实质性变动采购需求的技术、服务要求，须经（　）确认。","opts":[["A","评审委员会全体成员"],["B","监督人员"],["C","采购组织单位负责人"],["D","评审委员会中的采购人代表"]],"ans":"D","exp":"变动内容还须书面通知所有参加谈判的供应商。","law":""},{"id":"add2b-006","t":"single","ch":2,"mod":"M2","d":3,"kp":"2-17","kpn":"竞争性磋商程序","sc":0,"stem":"竞争性磋商中，磋商小组要求所有实质性响应的供应商在规定时间内提交最后报价后，应当：","opts":[["A","按最后报价最低者确定成交供应商"],["B","由采购人直接确定成交供应商"],["C","重新组织磋商"],["D","按综合评分得分由高到低排序，推荐成交候选供应商"]],"ans":"D","exp":"磋商采用综合评分法，按得分由高到低排序推荐成交候选供应商；按最低报价确定成交是竞争性谈判的规则。","law":"财库〔2014〕214号"},{"id":"single_050","t":"single","ch":2,"mod":"M2","d":4,"kp":"2-17","kpn":"竞争性磋商程序","sc":0,"stem":"竞争性磋商推荐成交候选供应商，首先按照（　）排序。","opts":[["A","评审得分由高到低"],["B","最后报价由低到高"],["C","技术指标优劣"],["D","响应文件递交先后"]],"ans":"A","exp":"得分相同再看报价，报价也相同再看技术指标。","law":""},{"id":"add2-020","t":"single","ch":2,"mod":"M2","d":2,"kp":"2-18","kpn":"询价程序","sc":0,"stem":"采用询价方式采购的，询价小组应当邀请多少家以上符合资格条件的供应商参加报价？","opts":[["A","3家"],["B","2家"],["C","5家"],["D","不限家数"]],"ans":"A","exp":"询价小组应从符合资格条件的供应商中确定不少于3家的供应商参加报价，并要求一次报出不得更改的价格。","law":"财政部令第74号"},{"id":"add2-021","t":"single","ch":2,"mod":"M2","d":3,"kp":"2-19","kpn":"单一来源程序","sc":0,"stem":"采用单一来源方式采购的，其公示期不得少于几个工作日？","opts":[["A","3个工作日"],["B","5个工作日"],["C","7个工作日"],["D","10个工作日"]],"ans":"B","exp":"单一来源采购公示期不得少于5个工作日；公示期内有异议的，应组织补充论证。","law":"财政部令第74号第38条"},{"id":"add2-022","t":"single","ch":2,"mod":"M2","d":3,"kp":"2-20","kpn":"框架协议第二阶段","sc":0,"stem":"框架协议采购第二阶段，在满足采购需求且价格透明、需求明确的情况下，最适合采用的确定成交供应商方式是：","opts":[["A","二次竞价"],["B","重新招标"],["C","顺序轮候"],["D","直接选定"]],"ans":"D","exp":"需求明确、价格透明时可直接选定；同品目多家入围且需比价的采用二次竞价；按入围顺序依次成交的为顺序轮候。","law":"财政部令第110号第27条"},{"id":"add2-017","t":"single","ch":2,"mod":"M2","d":3,"kp":"2-21","kpn":"澄清与说明","sc":0,"stem":"某供应商投标文件中开标一览表报价为500万元，投标函报价为480万元，分项报价合计为520万元。评审时应以哪个价格为准？","opts":[["A","480万元"],["B","500万元"],["C","520万元"],["D","由供应商现场重新确认"]],"ans":"B","exp":"报价前后不一致的，以开标一览表（报价表）为准；大写与小写不一致的以大写为准。","law":"财政部令第87号"},{"id":"single_042","t":"single","ch":2,"mod":"M2","d":4,"kp":"2-21","kpn":"澄清与说明","sc":0,"stem":"投标文件大写金额与小写金额不一致，大写金额无文字错误的，应当（　）。","opts":[["A","以小写金额为准"],["B","以大写金额为准"],["C","要求供应商澄清"],["D","作无效投标处理"]],"ans":"B","exp":"大写优先是财务文书通行的认定规则。","law":""},{"id":"single_043","t":"single","ch":2,"mod":"M2","d":5,"kp":"2-21","kpn":"澄清与说明","sc":0,"stem":"投标文件总价金额与按单价汇总金额不一致，单价计算无误的，应当（　）。","opts":[["A","以总价为准"],["B","以两者平均值为准"],["C","以单价汇总金额为准"],["D","作无效投标处理"]],"ans":"C","exp":"以单价汇总为准；若汇总高于总价且超过预算或最高限价，则作无效投标。","law":""},{"id":"single_048","t":"single","ch":2,"mod":"M2","d":3,"kp":"2-22","kpn":"废标情形","sc":0,"stem":"采购项目在评审过程中废标的，评审委员会应当（　）。","opts":[["A","直接出具废标决定"],["B","报财政部门批准"],["C","对招标文件是否存在倾向性、歧视性进行论证并出具书面论证意见"],["D","重新组织评审"]],"ans":"C","exp":"论证意见应针对是否存 ],["C","是否按要求签署、盖章"],["D","技术参数是否满足采购文件的实质性要求"],["E","投标报价是否超过预算金额或最高限价"]],"ans":"ACDE","exp":"符合性审查针对响应文件对采购文件实质性要求的响应程度；注册资本属于不得设置的规模条件，不能作为审查内容。","law":"财政部令第87号"},{"id":"add2-011","t":"multi","ch":2,"mod":"M2","d":3,"kp":"2-09","kpn":"无效响应认定","sc":0,"stem":"下列情形中，应当认定供应商响应文件无效的有：","opts":[["A","未按照采购文件要求签署、盖章"],["B","报价超过采购预算或最高限价"],["C","与采购人、其他供应商或者采购代理机构恶意串通"],["D","提供虚假材料谋取中标成交"],["E","投标文件采用双面打印"]],"ans":"ABCD","exp":"前四项均为法定无效情形；打印方式不属于实质性要求，不能据此认定无效。","law":"财政部令第87号、第74号"},{"id":"multi_041","t":"multi","ch":2,"mod":"M2","d":5,"kp":"2-17","kpn":"竞争性磋商程序","sc":0,"stem":"竞争性磋商采购中，成交候选供应商的排序规则包括（　）。","opts":[["A","按评审后得分由高到低顺序排列"],["B","得分且最后报价相同的，按照技术指标优劣顺序推荐"],["C","报价相同的，按递交响应文件时间先后顺序排列"],["D","得分相同的，按最后报价由低到高顺序排列"]],"ans":"ABD","exp":"D项无规范依据；得分、最后报价、技术指标分项得分均相同的，成交候选供应商并列。","law":""},{"id":"add2-012","t":"multi","ch":2,"mod":"M2","d":3,"kp":"2-22","kpn":"废标情形","sc":0,"stem":"招标采购中出现下列哪些情形，应当废标？","opts":[["A","符合专业条件的供应商或者对招标文件作实质响应的供应商不足3家"],["B","因重大变故，采购任务取消"],["C","出现影响采购公正的违法、违规行为"],["D","投标人的报价均超过了采购预算，采购人不能支付"],["E","中标供应商放弃中标"]],"ans":"ABCD","exp":"前四项为政府采购法规定的废标情形；中标供应商放弃中标应按候选人顺序确定或重新采购，不属废标。","law":"政府采购法第36条"},{"id":"multi_020","t":"multi","ch":2,"mod":"M2","d":5,"kp":"2-22","kpn":"废标情形","sc":0,"stem":"投标文件出现下列（　）情形，不需要供应商澄清，按规定原则直接处理。","opts":[["A","大写金额与小写金额不一致的，以大写金额为准"],["B","总价与单价汇总不一致的，以单价汇总金额为准"],["C","单价金额小数点有明显错位的，以总价为准并修改单价"],["D","不同语言文本解释有异议的，以中文文本为准"]],"ans":"ABCD","exp":"上述规则适用于招标采购，且各有除外情形。","law":""},{"id":"multi_023","t":"multi","ch":2,"mod":"M2","d":3,"kp":"2-22","kpn":"废标情形","sc":0,"stem":"在招标采购中，出现下列（　）情形，应予废标。","opts":[["A","符合专业条件或对招标文件作实质响应的供应商不足三家"],["B","出现影响采购公正的违法、违规行为"],["C","投标人的报价均超过采购预算，采购人不能支付"],["D","因重大变故，采购任务取消"]],"ans":"ABCD","exp":"中标供应商确定后，不得再以“不足三家”为由废标。","law":""},{"id":"multi_035","t":"multi","ch":2,"mod":"M2","d":2,"kp":"2-23","kpn":"终止采购","sc":0,"stem":"竞争性谈判采购中出现下列（　）情形，应当终止采购活动并重新开展。","opts":[["A","出现影响采购公正的违法、违规行为"],["B","因情况变化，不再符合竞争性谈判方式适用情形"],["C","符合竞争要求或报价未超过预算的供应商不足3家"],["D","成交供应商报价偏高"]],"ans":"ABC","exp":"终止应发布项目终止公告并说明原因。","law":""},{"id":"add2-014","t":"multi","ch":2,"mod":"M2","d":4,"kp":"2-24","kpn":"重新评审","sc":0,"stem":"评审结束后，出现下列哪些情形可以组织重新评审？","opts":[["A","经评审委员会认定评分畸高、畸低"],["B","客观评分不一致"],["C","分项评分超出评分标准范围"],["D","分值汇总计算错误"],["E","采购人对评审结果不满意"]],"ans":"ABCD","exp":"重新评审仅限四种法定情形，且应书面报告本级财政部门；采购人主观不满意不能成为重新评审的理由。","law":"财政部令第87号第64条、政府采购法实施条例第44条"},{"id":"multi_021","t":"multi","ch":2,"mod":"M2","d":4,"kp":"2-24","kpn":"重新评审","sc":0,"stem":"采购组织单位现场复核发现下列（　）情形，应当书面建议评审委员会修改评审结果或重新评审。","opts":[["A","资格性审查认定错误"],["B","分值汇总计算错误"],["C","分项评分超出评分标准范围"],["D","客观评分不一致"]],"ans":"ABCD","exp":"采纳与否由评审委员会自主决定并承担独立评审责任。","law":""},{"id":"multi_022","t":"multi","ch":2,"mod":"M2","d":5,"kp":"2-24","kpn":"重新评审","sc":0,"stem":"下列（　）情形，不得修改评审结果或者重新评审。","opts":[["A","评审委员会已出具评审报告并离开评审现场"],["B","复核工作人员数量不足"],["C","复核时没有采购监督人员现场监督"],["D","复核内容超出规定范围"]],"ans":"ABCD","exp":"此外未提供书面建议的，也不得修改或重新评审。","law":""},{"id":"add2-023","t":"multi","ch":2,"mod":"M2","d":3,"kp":"2-25","kpn":"评审报告","sc":0,"stem":"评审报告应当包括的主要内容有：","opts":[["A","评审委员会成员签字"],["B","供应商的报价成本分析报告"],["C","废标或者终止采购的说明"],["D","评审依据、评审程序"],["E","评审结果与中标（成交）候选人名单"]],"ans":"ACDE","exp":"评审报告应载明评审依据、程序、结果、候选人名单及理由、废标说明等，并由全体成员签字；成本分析报告不属于必备内容。","law":"财政部令第87号"},{"id":"multi_025","t":"multi","ch":2,"mod":"M2","d":3,"kp":"2-25","kpn":"评审报告","sc":0,"stem":"关于评审报告的签字确认，下列说法正确的有（　）。","opts":[["A","评审委员会成员应当签字确认"],["B","有不同意见的应当在报告中写明并说明理由"],["C","签字但未写明不同意见或未说明理由的，视同无意见"],["D","未签字又未另行书面说明的，视同同意评审结果"]],"ans":"ABCD","exp":"签字规则直接决定评审意见的归属和责任。","law":""},{"id":"add2-028","t":"multi","ch":2,"mod":"M2","d":2,"kp":"2-32","kpn":"评审现场纪律","sc":0,"stem":"评审过程中，评审委员会成员不得有下列哪些行为？","opts":[["A","私下接触供应商"],["B","使用通讯工具与外界联系"],["C","泄露评审文件、评审情况"],["D","在评审报告上签署不同意见并说明理由"],["E","带走或者复制评审资料"]],"ans":"ABCE","exp":"签署不同意见并说明理由是法定权利，不是违纪行为；其余四项均属评审纪律禁止行为。","law":"财库〔2016〕198号、四川省政府采购评审工作规程"},{"id":"multi_024","t":"multi","ch":2,"mod":"M2","d":3,"kp":"2-32","kpn":"评审现场纪律","sc":0,"stem":"评审现场人员包括（　）。","opts":[["A","评审委员会成员"],["B","采购组织单位为评审提供事务性服务的工作人员"],["C","监督人员"],["D","参加采购活动的供应商工作人员"]],"ans":"ABCD","exp":"还包括复核工作人员和采购人负责采购项目的工作人员。","law":""},{"id":"multi_026","t":"multi","ch":2,"mod":"M2","d":4,"kp":"2-32","kpn":"评审现场纪律","sc":0,"stem":"评标委员会及其成员不得有下列（　）行为。","opts":[["A","确定参与评标至评标结束前私自接触投标人"],["B","接受投标人提出的与投标文件不一致的澄清或说明"],["C","违反评标纪律发表倾向性意见或征询采购人倾向性意见"],["D","对需要专业判断的主观评审因素协商评分"]],"ans":"ABCD","exp":"87号令第六十二条还禁止擅离职守、记录复制带走评标资料等。","law":""},{"id":"add2-033","t":"multi","ch":2,"mod":"M2","d":3,"kp":"4-18","kpn":"采购人主体责任","sc":1,"stem":"按四川省政府采购项目采购人主体责任清单，采购人在评审环节应当履行的责任包括：","opts":[["A","擅自改变评审结果"],["B","向评审委员会介绍项目背景和采购需求，但不得发表倾向性意见"],["C","对评审委员会提出的澄清事项及时处理"],["D","依法组建评审委员会，按规定抽取评审专家"],["E","对评审过程进行录音录像并留存"]],"ans":"BCDE","exp":"采购人应依法组织评审、介绍项目情况但不得干预评审、留存评审资料、配合澄清；擅自改变评审结果属违法行为。","law":"《四川省政府采购项目采购人主体责任清单（2025年版）》"},{"id":"add2-036","t":"multi","ch":2,"mod":"M2","d":3,"kp":"4-21","kpn":"典型问题清单","sc":1,"stem":"下列属于四川省政府采购文件典型问题清单所列问题的有：","opts":[["A","要求投标文件按照采购文件规定的格式编制"],["B","将供应商注册资本作为资格条件"],["C","以特定区域业绩作为加分条件"],["D","评分标准未量化、分值设置与评审因素不对应"],["E","要求供应商在本地设立分支机构"]],"ans":"BCDE","exp":"前四项均为典型问题（差别歧视条款、规模条件、评分不量化、地域限制）；按要求编制文件格式属正常要求。","law":"四川省财政厅政府采购文件典型问题清单"},{"id":"add2b-012","t":"multi","ch":2,"mod":"M2","d":3,"kp":"4-21","kpn":"典型问题清单","sc":1,"stem":"按四川省政府采购供应商典型问题清单，供应商常见的违法违规行为包括：","opts":[["A","提供虚假材料谋取中标成交"],["B","不按合同约定履行义务"],["C","与其他供应商围标串标"],["D","对采购文件提出质疑"],["E","中标后无正当理由放弃中标"]],"ans":"ABCE","exp":"前四项均为典型问题；依法提出质疑是供应商的法定救济权利，不属于违法违规行为。","law":"四川省财政厅政府采购供应商典型问题清单"},{"id":"multi_015","t":"multi","ch":3,"mod":"M3","d":3,"kp":"3-01","kpn":"专家权利","sc":0,"stem":"评审委员会依法享有下列（　）权利。","opts":[["A","对政府采购法律制度及相关情况的知情权"],["B","不受非法干预的独立评审权"],["C","按照规定推荐中标（成交）候选供应商"],["D","按照规定获取相应评审劳务报酬"]],"ans":"ABCD","exp":"权利与义务相对应，独立评审既是权利也是义务。","law":""},{"id":"multi_014","t":"multi","ch":3,"mod":"M3","d":3,"kp":"3-02","kpn":"专家义务","sc":0,"stem":"评审委员会应当履行的职责包括（　）。","opts":[["A","熟悉和理解采购文件"],["B","审查供应商投标（响应）文件是否满足采购文件要求并作出评价"],["C","推荐中标（成交）候选供应商，或者受委托确定中标（成交）供应商"],["D","起草资格审查报告、评审报告并签署"]],"ans":"ABCD","exp":"还包括要求解释采购文件、要求供应商澄清，以及报告非法干预行为。","law":""},{"id":"multi_032","t":"multi","ch":3,"mod":"M3","d":3,"kp":"3-02","kpn":"专家义务","sc":0,"stem":"评审专家应当履行的义务包括（　）。","opts":[["A","遵守评审工作纪律"],["B","按照采购文件规定的程序、方法、标准独立评审"],["C","不得泄露评审文件和评审中获悉的商业秘密"],["D","配合答复供应商的询问、质疑和投诉"]],"ans":"ABCD","exp":"义务不履行将承担相应法律责任并被记入不良行为记录。","law":""},{"id":"multi_016","t":"multi","ch":3,"mod":"M3","d":3,"kp":"3-09","kpn":"保密义务","sc":0,"stem":"评审委员会成员在评审过程中应当遵守的工作纪律包括（　）。","opts":[["A","将通讯工具或相关电子设备交采购组织单位统一保管"],["B","不得发表倾向性、引导性意见"],["C","不得对需要专业判断的主观评审因素协商评分"],["D","不得私下接触供应商或收受其财物"]],"ans":"ABCD","exp":"还包括不得修改评审标准、不得带走评审资料、不得征询采购人代表意见等。","law":""},{"id":"multi_019","t":"multi","ch":3,"mod":"M3","d":4,"kp":"3-15","kpn":"停止评审义务","sc":0,"stem":"评审委员会发现采购文件有下列（　）情形之一的，应当停止评审。","opts":[["A","采购文件的规定存在歧义、重大缺陷"],["B","采购文件明显以不合理条件对供应商实行差别待遇（单一来源除外）"],["C","招标文件将投标人的资格条件列为评分因素"],["D","采购项目属于优先、强制采购范围但采购文件未依法体现"]],"ans":"ABCD","exp":"此外还包括未体现促进中小企业发展规定、评标方法不合法等情形。","law":""},{"id":"multi_017","t":"multi","ch":3,"mod":"M3","d":3,"kp":"3-19","kpn":"不良行为记录","sc":0,"stem":"下列情形中，应当列入评审专家不良行为记录的有（　）。","opts":[["A","提供虚假信息材料"],["B","泄露评审文件、评审情况"],["C","未按采购文件规定的程序、方法、标准独立评审"],["D","收受供应商贿赂或者获取其他不正当利益"]],"ans":"ABCD","exp":"川财规〔2023〕5号第四十四条共列举八类情形。","law":""},{"id":"multi_038","t":"multi","ch":3,"mod":"M3","d":2,"kp":"3-19","kpn":"不良行为记录","sc":1,"stem":"四川省评审专家存在下列（　）情形之一的，列入不良行为记录。","opts":[["A","为实现非法目的搜集其他评审专家信息或者与其他评审专家串通"],["B","与供应商存在利害关系未回避"],["C","提供虚假信息材料"],["D","参加评审迟到30分钟以内的"]],"ans":"ABC","exp":"迟到30分钟以内属可扣减评审费的情形，不列入不良行为记录；不良行为记录共八项。","law":""},{"id":"add3-005","t":"multi","ch":3,"mod":"M3","d":3,"kp":"4-09","kpn":"解聘情形","sc":1,"stem":"按四川省政府采购评审专家管理办法，省级以上财政部门应当将评审专家解聘的情形有：","opts":[["A","不符合本办法规定的专家条件"],["B","本人申请不再担任评审专家"],["C","存在不良行为记录"],["D","连续两次未参加财政部门组织的培训"],["E","受到刑事处罚"]],"ans":"ABCE","exp":"解聘情形为不符合条件、本人申请、存在不良行为记录、受到刑事处罚四类；未参加培训不属于法定解聘情形。","law":"川财规〔2023〕12号第11条"},{"id":"multi_011","t":"multi","ch":3,"mod":"M3","d":5,"kp":"4-09","kpn":"解聘情形","sc":1,"stem":"评审专家在聘期内存在下列（　）情形，不予续聘。","opts":[["A","聘期内曾变更过联系电话"],["B","除从未被抽取外，聘期内未参加过政府采购评审活动"],["C","因身体状况或不在四川省行政区域内居住，不再适宜从事评审工作"],["D","未参加教育培训或者考核测试不合格"]],"ans":"BCD","exp":"变更联系电话属于一般信息变更，不影响续聘。","law":""},{"id":"multi_012","t":"multi","ch":3,"mod":"M3","d":2,"kp":"4-09","kpn":"解聘情形","sc":1,"stem":"评审专家存在下列（　）情形之一的，应当解除聘任。","opts":[["A","聘期内本人申请不再担任评审专家"],["B","存在不良行为记录"],["C","受到刑事处罚"],["D","受到严重警告及以上党纪处分"]],"ans":"ABCD","exp":"此外受禁止参加评审行政处罚、受记大过及以上政务处分的也应解聘。","law":""},{"id":"add2-037","t":"multi","ch":3,"mod":"M3","d":3,"kp":"4-22","kpn":"\"四类\"专项整治","sc":1,"stem":"四川省政府采购领域“四类”违法违规行为专项整治，重点整治的行为包括：","opts":[["A","供应商报价低于预算金额"],["B","供应商围标串标"],["C","采购人设置差别歧视条款"],["D","供应商提供虚假材料"],["E","采购代理机构乱收费"]],"ans":"BCDE","exp":"“四类”指采购人差别歧视、代理机构乱收费、供应商提供虚假材料、供应商围标串标；报价低于预算属正常竞争。","law":"四川省2026年政府采购领域“四类”违法违规行为专项整治工作方案"},{"id":"multi_040","t":"multi","ch":3,"mod":"M3","d":3,"kp":"4-22","kpn":"\"四类\"专项整治","sc":1,"stem":"2026年政府采购领域\"四类\"违法违规行为专项整治的重点包括（　）。","opts":[["A","代理机构乱收费"],["B","采购人未编制政府采购预算"],["C","供应商提供虚假材料"],["D","采购人设置差别歧视条款"],["E","供应商围标串标"]],"ans":"ACDE","exp":"E项属预算管理问题，不在\"四类\"整治范围之内。","law":""},{"id":"tf_001","t":"tf","ch":1,"mod":"M1","d":1,"kp":"1-01","kpn":"政府采购定义与三要素","sc":0,"stem":"政府采购的主体包括各级国家机关、事业单位和团体组织，不包括国有企业。（　）","opts":[],"ans":"√","exp":"政府采购法第二条界定的主体只有三类：国家机关、事业单位、团体组织。","law":""},{"id":"tf_002","t":"tf","ch":1,"mod":"M1","d":1,"kp":"1-01","kpn":"政府采购定义与三要素","sc":0,"stem":"政府采购的对象包括货物、工程和服务。（　）","opts":[],"ans":"√","exp":"法条明确为“货物、工程和服务”，三者并列。","law":""},{"id":"tf_003","t":"tf","ch":1,"mod":"M1","d":3,"kp":"1-01","kpn":"政府采购定义与三要素","sc":0,"stem":"政府采购应当严格按照批准的预算执行，不得超预算、无预算开展采购。（　）","opts":[],"ans":"√","exp":"《政府采购法》第六条，预算约束是政府采购的前置条件。","law":""},{"id":"tf_065","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-01","kpn":"政府采购定义与三要素","sc":0,"stem":"政府采购，是指各级国家机关、事业单位和团体组织，使用财政性资金采购依法制定的集中采购目录以内的或者采购限额标准以上的货物、工程和服务的行为。（　）","opts":[],"ans":"√","exp":"《政府采购法》第二条对政府采购的定义，三个要素（主体、资金性质、标的范围）缺一不可。","law":""},{"id":"tf_007","t":"tf","ch":1,"mod":"M1","d":1,"kp":"1-05","kpn":"集中采购与分散采购","sc":0,"stem":"集中采购机构以外的社会中介机构，受采购人委托也可以从事政府采购代理业务。（　）","opts":[],"ans":"√","exp":"采购代理机构包括集中采购机构和社会中介机构两类。","law":""},{"id":"tf_009","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-05","kpn":"集中采购与分散采购","sc":0,"stem":"纳入集中采购目录的项目，采购人可以自行采购，也可以委托集中采购机构采购。（　）","opts":[],"ans":"×","exp":"纳入目录的项目应当实行集中采购，不得自行采购。","law":""},{"id":"tf_010","t":"tf","ch":1,"mod":"M1","d":3,"kp":"1-06","kpn":"集采目录与限额标准","sc":0,"stem":"属于地方预算的政府采购项目，其集中采购目录和采购限额标准均由省级人民政府或者其授权的机构确定并公布。（　）","opts":[],"ans":"√","exp":"《政府采购法》第七、八条，权限在省级。","law":""},{"id":"tf_017","t":"tf","ch":1,"mod":"M1","d":3,"kp":"1-08","kpn":"公开招标地位","sc":0,"stem":"采购人采购货物或者服务应当采用公开招标方式，因特殊情况需要采用其他方式的，应当在采购活动开始前获得设区的市、自治州以上人民政府采购监督管理部门的批准。（　）","opts":[],"ans":"√","exp":"注意是“采购活动开始前”批准，不能先采购后补批。","law":""},{"id":"tf_011","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-09","kpn":"邀请招标","sc":0,"stem":"邀请招标应当从符合资格条件的供应商中随机抽取3家以上，并以投标邀请书方式邀请其投标。（　）","opts":[],"ans":"√","exp":"“随机抽取＋3家以上”是邀请招标的两个关键要素。","law":""},{"id":"tf_012","t":"tf","ch":1,"mod":"M1","d":5,"kp":"1-10","kpn":"竞争性谈判","sc":0,"stem":"公开招标的货物、服务项目，招标过程中提交投标文件或者经评审实质性响应招标文件要求的供应商只有两家时，经批准可以与该两家供应商进行竞争性谈判。（　）","opts":[],"ans":"√","exp":"须经市（州）或者省政府依法授权有关财政部门批准。","law":""},{"id":"tf_066","t":"tf","ch":1,"mod":"M1","d":4,"kp":"1-11","kpn":"单一来源","sc":0,"stem":"因保证原有采购项目一致性或者服务配套的要求，需要继续从原供应商处添购，且添购资金总额不超过原合同采购金额20%的，可以采用单一来源方式采购。（　）","opts":[],"ans":"×","exp":"添购资金总额不得超过原合同采购金额的10%，20%系干扰项。","law":""},{"id":"add1-005","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-12","kpn":"询价","sc":0,"stem":"采用询价方式采购的，供应商可以多次报价，以最后一次报价为准。（　）","opts":[],"ans":"×","exp":"询价要求供应商一次报出不得更改的价格，不存在多次报价。","law":"政府采购法第32条、财政部令第74号"},{"id":"tf_013","t":"tf","ch":1,"mod":"M1","d":3,"kp":"1-12","kpn":"询价","sc":0,"stem":"询价采购要求供应商一次报出不得更改的价格。（　）","opts":[],"ans":"√","exp":"“一次报价、不得更改”是询价的核心特征。","law":""},{"id":"tf_014","t":"tf","ch":1,"mod":"M1","d":4,"kp":"1-13","kpn":"竞争性磋商","sc":0,"stem":"按照招标投标法及其实施条例必须进行招标的工程建设项目，可以采用竞争性磋商方式采购。（　）","opts":[],"ans":"×","exp":"竞争性磋商适用于必须招标的工程建设项目“以外”的工程建设项目。","law":""},{"id":"tf_016","t":"tf","ch":1,"mod":"M1","d":4,"kp":"1-14","kpn":"框架协议适用与两阶段","sc":0,"stem":"框架协议采购分为封闭式和开放式两种，以开放式框架协议为主。（　）","opts":[],"ans":"×","exp":"以封闭式框架协议为主，开放式是例外。","law":""},{"id":"tf_015","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-17","kpn":"合作创新采购","sc":0,"stem":"合作创新采购方式分为订购和首购两个阶段。（　）","opts":[],"ans":"√","exp":"订购阶段合作研发，首购阶段购买研发成功的产品。","law":""},{"id":"tf_060","t":"tf","ch":1,"mod":"M1","d":3,"kp":"1-18","kpn":"紧急采购","sc":0,"stem":"紧急采购原则上应当采购本国货物、工程和服务。（　）","opts":[],"ans":"√","exp":"确需进口的，自行确定并组织实施后报主管预算单位备案。","law":""},{"id":"tf_061","t":"tf","ch":1,"mod":"M1","d":3,"kp":"1-18","kpn":"紧急采购","sc":0,"stem":"紧急采购采用竞争性采购方式，提交响应文件或者通过审查的供应商只有两家或一家的，可以继续开展采购活动。（　）","opts":[],"ans":"√","exp":"前提是采购文件没有不合理条款。","law":""},{"id":"tf_062","t":"tf","ch":1,"mod":"M1","d":3,"kp":"1-18","kpn":"紧急采购","sc":0,"stem":"紧急采购确需采购进口产品的，无须获得设区的市、自治州以上财政部门批准，报主管预算单位备案即可。（　）","opts":[],"ans":"√","exp":"这是紧急采购简化程序的重要体现。","law":""},{"id":"tf_079","t":"tf","ch":1,"mod":"M1","d":4,"kp":"1-18","kpn":"紧急采购","sc":0,"stem":"紧急采购中，从原供应商处添购或者追加与合同标的相同的货物、工程、服务，添购或者追加的采购总额原则上不得超过原合同采购金额的30%。（　）","opts":[],"ans":"√","exp":"《紧急采购管理暂行办法》（财库〔2026〕12号）第十五条规定为30%，与常规采购单一来源添购10%不同，须区分。","law":""},{"id":"add1-026","t":"tf","ch":1,"mod":"M1","d":3,"kp":"1-20","kpn":"采购需求管理","sc":0,"stem":"采购人编制采购需求前，一律应当开展需求调查。（　）","opts":[],"ans":"×","exp":"需求调查适用于预算金额较高、社会影响较大、技术复杂或者专业性较强等情形，并非所有项目一律开展。","law":"财库〔2021〕22号"},{"id":"tf_008","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-21","kpn":"供应商资格条件","sc":0,"stem":"供应商是指向采购人提供货物、工程或者服务的法人、其他组织或者自然人。（　）","opts":[],"ans":"√","exp":"自然人也可以是供应商，这是常见易错点。","law":""},{"id":"add1-027","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-23","kpn":"关联供应商限制","sc":0,"stem":"单位负责人为同一人的两家供应商，可以参加同一合同项下的政府采购活动。（　）","opts":[],"ans":"×","exp":"单位负责人为同一人或者存在直接控股、管理关系的不同供应商，不得参加同一合同项下的政府采购活动。","law":"政府采购法实施条例第18条"},{"id":"add1-024","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-32","kpn":"合同公告","sc":0,"stem":"采购人应当自政府采购合同签订之日起5个工作日内，将合同在省级以上人民政府财政部门指定的媒体上公告。（　）","opts":[],"ans":"×","exp":"合同公告期限为自签订之日起2个工作日内（涉及国家秘密、商业秘密的除外）。","law":"政府采购法实施条例第50条"},{"id":"add1-021","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-35","kpn":"投诉处理","sc":0,"stem":"财政部门处理投诉事项期间，可以视情况暂停采购活动，暂停时间最长不得超过30日。（　）","opts":[],"ans":"√","exp":"暂停采购活动的最长期限为30日，与投诉处理决定的30个工作日不同，注意区分“日”与“工作日”。","law":"财政部令第94号第29条"},{"id":"tf_004","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-37","kpn":"信息发布","sc":0,"stem":"政府采购信息一律应当向社会公开，不存在任何例外情形。（　）","opts":[],"ans":"×","exp":"法律规定“涉及商业秘密的除外”。","law":""},{"id":"tf_018","t":"tf","ch":1,"mod":"M1","d":1,"kp":"1-38","kpn":"专家定义与管理原则","sc":0,"stem":"政府采购评审专家应当经省级以上人民政府财政部门选聘。（　）","opts":[],"ans":"√","exp":"国家级为财政部，省级为省财政厅。","law":""},{"id":"tf_019","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-38","kpn":"专家定义与管理原则","sc":0,"stem":"评审专家管理实行管用分离，财政部门负责管理，采购人和采购代理机构负责使用。（　）","opts":[],"ans":"√","exp":"“统一标准、管用分离、随机抽取”原则的具体体现。","law":""},{"id":"tf_069","t":"tf","ch":1,"mod":"M1","d":4,"kp":"1-38","kpn":"专家定义与管理原则","sc":1,"stem":"拟聘任评审专家名单应当在四川政府采购网公示，公示期为5个工作日。（　）","opts":[],"ans":"×","exp":"拟聘任名单公示期为10个工作日；续聘名单公示期为5个工作日，两者不可混同。","law":""},{"id":"tf_020","t":"tf","ch":1,"mod":"M1","d":3,"kp":"1-39","kpn":"专家条件（国家）","sc":0,"stem":"申请评审专家应当具有中级专业技术职称且从事相关领域工作满6年。（　）","opts":[],"ans":"×","exp":"中级职称对应的工作年限要求是满8年。","law":""},{"id":"tf_022","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-39","kpn":"专家条件（国家）","sc":0,"stem":"评审专家资格审核包括初审、复审和终审，其中初审由市（州）财政部门负责。（　）","opts":[],"ans":"√","exp":"复审和终审由四川省财政厅负责。","law":""},{"id":"tf_068","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-39","kpn":"专家条件（国家）","sc":1,"stem":"申请成为四川省政府采购评审专家，应当不满65周岁、身体健康、能够承担评审工作。（　）","opts":[],"ans":"×","exp":"年龄条件为不满70周岁（该办法第六条第（五）项）。","law":""},{"id":"tf_070","t":"tf","ch":1,"mod":"M1","d":4,"kp":"1-40","kpn":"抽取时间","sc":1,"stem":"除采用竞争性谈判、竞争性磋商方式采购以及异地评审的项目外，采购人或者采购代理机构抽取评审专家原则上不得早于评审活动开始前2个工作日；同城使用评审专家的，一般应于评审当天抽取。（　）","opts":[],"ans":"√","exp":"川财规〔2023〕5号第二十六条，同时规定同城使用专家一般应于评审当天抽取。","law":""},{"id":"tf_005","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-41","kpn":"专家回避（国家）","sc":0,"stem":"供应商认为采购人员及相关人员与其他供应商有利害关系的，可以申请其回避。（　）","opts":[],"ans":"√","exp":"《政府采购法》第十二条第二款赋予供应商回避申请权。","law":""},{"id":"add1-011","t":"tf","ch":1,"mod":"M1","d":3,"kp":"1-46","kpn":"中小企业政策","sc":0,"stem":"小微企业报价经价格扣除后用于评审的，中标后应当按照扣除后的价格签订合同。（　）","opts":[],"ans":"×","exp":"价格扣除仅用于评审比较，中标后仍按供应商的实际报价签订合同。","law":"财库〔2020〕46号"},{"id":"tf_058","t":"tf","ch":1,"mod":"M1","d":4,"kp":"1-46","kpn":"中小企业政策","sc":0,"stem":"政府采购中既有本国产品又有非本国产品竞争的，对本国产品报价给予20%的价格扣除。（　）","opts":[],"ans":"√","exp":"用扣除后的价格参与评审。","law":""},{"id":"tf_059","t":"tf","ch":1,"mod":"M1","d":5,"kp":"1-46","kpn":"中小企业政策","sc":0,"stem":"采购项目中含有多种产品，本国产品成分占比达到80%以上的，可以对全部产品总报价给予价格扣除。（　）","opts":[],"ans":"√","exp":"按全部产品总报价给予20%扣除。","law":""},{"id":"add1-012","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-48","kpn":"残疾人福利性单位","sc":0,"stem":"残疾人福利性单位属于小型、微型企业的，可以同时享受残疾人福利性单位和小型微型企业两项扶持政策。（　）","opts":[],"ans":"×","exp":"残疾人福利性单位视同小微企业，但其本身属于小微企业的，不重复享受政策。","law":"财库〔2017〕141号"},{"id":"add1-015","t":"tf","ch":1,"mod":"M1","d":2,"kp":"1-50","kpn":"乡村振兴","sc":0,"stem":"预算单位采购脱贫地区农副产品，应当通过脱贫地区农副产品网络销售平台（即“832平台”）进行。（　）","opts":[],"ans":"√","exp":"财库〔2021〕19号明确通过脱贫地区农副产品网络销售平台（832平台）采购，并预留一定比例。","law":"财库〔2021〕19号"},{"id":"add1-016","t":"tf","ch":1,"mod":"M1","d":3,"kp":"1-51","kpn":"进口产品管理","sc":1,"stem":"参与进口产品论证的专家，可以作为评审专家参加同一项目的评审工作。（　）","opts":[],"ans":"×","exp":"参与进口产品论证的专家不得作为评审专家参与同一项目的评审，四川省评审专家管理办法对此有明确重申。","law":"财库〔2007〕119号、川财规〔2023〕12号"},{"id":"tf_056","t":"tf","ch":1,"mod":"M1","d":3,"kp":"1-52","kpn":"本国产品标准","sc":0,"stem":"本国产品标准适用于货物，包括政府采购货物项目和服务项目中涉及的货物。（　）","opts":[],"ans":"√","exp":"不适用于房屋构筑物、文物、图书档案等品目。","law":""},{"id":"tf_057","t":"tf","ch":1,"mod":"M1","d":5,"kp":"1-52","kpn":"本国产品标准","sc":0,"stem":"在中国境内保税区、综合保税区等海关特殊监管区域生产的产品，不属于在中国境内生产的产品。（　）","opts":[],"ans":"×","exp":"财库〔2025〕30号明确此类产品属于在中国境内生产。","law":""},{"id":"tf_077","t":"tf","ch":1,"mod":"M1","d":4,"kp":"1-53","kpn":"异常低价","sc":0,"stem":"政府采购评审中出现投标（响应）报价低于采购项目最高限价45%情形的，评审委员会应当启动异常低价审查程序。（　）","opts":[],"ans":"√","exp":"财库〔2026〕2号明确三类数值标准之一即为低于最高限价45%。","law":""},{"id":"tf_078","t":"tf","ch":1,"mod":"M1","d":4,"kp":"1-53","kpn":"异常低价","sc":0,"stem":"采购人可以结合项目实际提高异常低价审查的数值标准，但最高不得超过75%。（　）","opts":[],"ans":"×","exp":"可以提高第1至第3项数值标准，但最高不得超过65%。","law":""},{"id":"tf_006","t":"tf","ch":1,"mod":"M1","d":1,"kp":"1-55","kpn":"监督检查体制","sc":0,"stem":"各级财政部门是政府采购监督管理部门，审计部门是监督部门，监察机关是监察部门。（　）","opts":[],"ans":"√","exp":"三者职能各有侧重，不可混同。","law":""},{"id":"add1-032","t":"tf","ch":1,"mod":"M1","d":2,"kp":"4-02","kpn":"废止文件","sc":1,"stem":"《四川省政府采购评审专家管理实施办法》（川财采〔2017〕62号）至今仍然有效，与川财规〔2023〕12号并行适用。（　）","opts":[],"ans":"×","exp":"62号文已于2023年10月7日随川财规〔2023〕12号施行而废止，不得再作为依据。","law":"川财规〔2023〕12号第53条"},{"id":"tf_021","t":"tf","ch":1,"mod":"M1","d":4,"kp":"4-03","kpn":"四川专家条件","sc":1,"stem":"对评审专家数量较少的品目，取得博士学位的申请人从事相关工作年限可以放宽至4年。（　）","opts":[],"ans":"√","exp":"硕士放宽至6年，博士放宽至4年。","law":""},{"id":"tf_023","t":"tf","ch":1,"mod":"M1","d":2,"kp":"4-04","kpn":"续聘期限","sc":1,"stem":"评审专家聘期届满未申请续聘的，其专家资格自动延续至下一聘期。（　）","opts":[],"ans":"×","exp":"须本人提出申请并经培训测试、审核、公示后续聘，不会自动延续。","law":""},{"id":"tf_067","t":"tf","ch":1,"mod":"M1","d":2,"kp":"4-04","kpn":"续聘期限","sc":1,"stem":"四川省政府采购评审专家由四川省财政厅统一聘任，实行聘期制，聘期3年。（　）","opts":[],"ans":"√","exp":"《四川省政府采购评审专家管理办法》（川财规〔2023〕5号）第十五条，聘期3年，由省财政厅统一聘任。","law":""},{"id":"add1-035","t":"tf","ch":1,"mod":"M1","d":3,"kp":"4-05","kpn":"增加品目","sc":1,"stem":"四川省评审专家可以在聘期内随时申请增加评审品目。（　）","opts":[],"ans":"×","exp":"评审专家只能在续聘时申请增加评审品目，聘期内不得随意变更。","law":"川财规〔2023〕12号"},{"id":"tf_024","t":"tf","ch":1,"mod":"M1","d":3,"kp":"4-05","kpn":"增加品目","sc":1,"stem":"评审专家在续聘时可以申请变更评审品目，其他时间不得变更，但减少评审品目的除外。（　）","opts":[],"ans":"√","exp":"川财规〔2023〕5号第四十条的规定。","law":""},{"id":"add1-034","t":"tf","ch":1,"mod":"M1","d":3,"kp":"4-07","kpn":"迟到处理","sc":1,"stem":"采购人或者采购代理机构启动补抽程序的，迟到的评审专家不得参加评审，且不得获取劳务报酬。（　）","opts":[],"ans":"√","exp":"这是四川省评审专家管理办法对迟到行为的特别规定，须同时满足“已启动补抽程序”这一前提。","law":"川财规〔2023〕12号"},{"id":"tf_027","t":"tf","ch":1,"mod":"M1","d":4,"kp":"4-08","kpn":"电子证书","sc":1,"stem":"评审专家身份验证结果与抽取结果不一致的，经采购人同意后可以参加评审。（　）","opts":[],"ans":"×","exp":"验证结果与抽取结果不一致的，不得参加评审。","law":""},{"id":"add3-003","t":"tf","ch":1,"mod":"M1","d":3,"kp":"4-10","kpn":"测试不合格后果","sc":1,"stem":"四川省评审专家因测试成绩不合格被解聘的，原则上不再接受其评审专家资格申请。（　）","opts":[],"ans":"√","exp":"四川强化退库机制，除测试成绩不合格外，被解聘的专家原则上不再接受其资格申请。这也是本考试必须认真对待的现实原因。","law":"川财规〔2023〕12号"},{"id":"tf_075","t":"tf","ch":1,"mod":"M1","d":5,"kp":"4-11","kpn":"暂停期限","sc":1,"stem":"财政部门调查处理检举事项时，可以暂停评审专家参加政府采购评审活动，暂停时间最长不得超过60日。（　）","opts":[],"ans":"×","exp":"暂停参加评审活动的时间最长不得超过30日，并应书面告知专家。","law":""},{"id":"add2-031","t":"tf","ch":1,"mod":"M1","d":3,"kp":"4-14","kpn":"劳务报酬标准","sc":1,"stem":"四川省评审专家劳务报酬按评审时间分档计付，而非按项目金额比例计付。（　）","opts":[],"ans":"√","exp":"四川按评审时间分档确定劳务报酬标准（如1小时以内、1—3小时、3—6小时、6小时以上等档位）。","law":"《四川省政府采购评审专家劳务报酬标准》"},{"id":"tf_026","t":"tf","ch":1,"mod":"M1","d":3,"kp":"4-15","kpn":"异地评审","sc":1,"stem":"评审专家应当根据本人申报的评审品目、评审区域从事政府采购评审活动。（　）","opts":[],"ans":"√","exp":"超品目、超区域评审不符合规定。","law":""},{"id":"add1-038","t":"tf","ch":1,"mod":"M1","d":3,"kp":"4-17","kpn":"集采目录及标准","sc":1,"stem":"四川省政府集中采购目录及标准由各市（州）人民政府自行确定并公布。（　）","opts":[],"ans":"×","exp":"集中采购目录及标准由省级人民政府或者其授权机构确定并公布，市州不得自行确定。","law":"政府采购法第8条、《四川省政府集中采购目录及标准（2024年版）》"},{"id":"add2-032","t":"tf","ch":2,"mod":"M2","d":3,"kp":"1-45","kpn":"劳务报酬支付主体","sc":1,"stem":"四川省集中采购项目的评审专家劳务报酬，由集中采购机构支付。（　）","opts":[],"ans":"√","exp":"集中采购项目由集中采购机构支付，集中采购目录外项目由采购人支付。","law":"财库〔2016〕198号、四川省劳务报酬标准"},{"id":"add2-005","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-01","kpn":"评审委员会人数","sc":0,"stem":"达到公开招标数额标准的货物采购项目，经批准采用竞争性磋商方式的，磋商小组应当由5人以上单数组成。（　）","opts":[],"ans":"√","exp":"达到公开招标数额标准的货物、服务项目经批准采用非招标方式的，评审委员会应由5人以上单数组成，专家不少于2/3。","law":"财政部令第74号及相关规定"},{"id":"tf_040","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-01","kpn":"评审委员会人数","sc":0,"stem":"采用竞争性磋商方式的，评审委员会成员人数应当为5人以上单数。（　）","opts":[],"ans":"×","exp":"竞争性磋商为3人以上单数。","law":""},{"id":"tf_042","t":"tf","ch":2,"mod":"M2","d":5,"kp":"2-01","kpn":"评审委员会人数","sc":0,"stem":"评审委员会成员确定，是指采购人已委托采购人代表并送交书面委托书，且评审专家已抽取结束并形成抽取结果。（　）","opts":[],"ans":"√","exp":"两个条件同时具备才算“确定”，确定后不得擅自变更。","law":""},{"id":"tf_039","t":"tf","ch":2,"mod":"M2","d":2,"kp":"2-02","kpn":"专家比例","sc":0,"stem":"评审委员会中评审专家不得少于成员总数的三分之二。（　）","opts":[],"ans":"√","exp":"这是保证评审独立性的底线比例。","law":""},{"id":"add2-007","t":"tf","ch":2,"mod":"M2","d":2,"kp":"2-03","kpn":"采购人代表","sc":0,"stem":"采购人代表可以担任评审委员会组长并主持评审工作。（　）","opts":[],"ans":"×","exp":"采购人代表不得以评审专家身份参加本部门项目评审，也不得担任评审委员会组长；组长应由评审专家推选产生。","law":"政府采购法实施条例、四川省政府采购评审工作规程"},{"id":"tf_041","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-03","kpn":"采购人代表","sc":0,"stem":"采购人代表可以委托评审专家或者其他人员担任，但不能以评审专家身份参加评审。（　）","opts":[],"ans":"√","exp":"双重身份会导致专家比例失真。","law":""},{"id":"add2b-003","t":"tf","ch":2,"mod":"M2","d":2,"kp":"2-06","kpn":"评审前准备","sc":0,"stem":"评审委员会组长由采购人代表指定。（　）","opts":[],"ans":"×","exp":"评审委员会组长由评审委员会成员推选产生，采购人代表不得指定组长，也不得担任组长。","law":"四川省政府采购评审工作规程、财政部令第87号"},{"id":"tf_043","t":"tf","ch":2,"mod":"M2","d":2,"kp":"2-06","kpn":"评审前准备","sc":0,"stem":"评审前，采购组织单位应当核实评审委员会成员身份，告知回避要求，宣布评审工作纪律和程序。（　）","opts":[],"ans":"√","exp":"属于评审前准备的法定动作。","law":""},{"id":"tf_044","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-06","kpn":"评审前准备","sc":0,"stem":"采购人介绍采购项目背景和技术需求的书面材料应当加盖单位公章，并作为采购文件存档。（　）","opts":[],"ans":"√","exp":"书面材料不得有歧视性、倾向性内容，不得超出采购文件范围。","law":""},{"id":"tf_071","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-06","kpn":"评审前准备","sc":0,"stem":"评审委员会组长由采购人代表担任，主要负责协调成员之间的事务性工作、牵头与采购组织单位交涉相关事宜。（　）","opts":[],"ans":"×","exp":"评审委员会组长由评审专家担任，采购人代表不得担任；组长与其他成员法定职责、权利义务相同。","law":""},{"id":"tf_072","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-07","kpn":"资格性审查","sc":0,"stem":"招标采购中，投标人的资格性审查由采购人或者采购代理机构负责，评标不再包括资格性审查。（　）","opts":[],"ans":"√","exp":"财政部令第87号第四十四条明确资格审查由采购人或采购代理机构负责，评标仅含符合性审查及比较评价。","law":""},{"id":"add2-003","t":"tf","ch":2,"mod":"M2","d":2,"kp":"2-10","kpn":"最低评标价法","sc":0,"stem":"采购需求中技术、服务等标准统一的货物服务项目，宜采用最低评标价法。（　）","opts":[],"ans":"√","exp":"技术、服务标准统一、无特殊要求的项目宜采用最低评标价法；需综合比较技术、商务条件的采用综合评分法。","law":"政府采购法实施条例"},{"id":"add2b-002","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-11","kpn":"综合评分法","sc":0,"stem":"采用综合评分法的，评审标准中的分值设置应当与评审因素的量化指标相对应。（　）","opts":[],"ans":"√","exp":"这是实施条例的强制要求，评分标准必须量化、可计算，不能只写“优、良、中、差”而无对应分值。","law":"政府采购法实施条例"},{"id":"tf_051","t":"tf","ch":2,"mod":"M2","d":4,"kp":"2-15","kpn":"招标评审程序","sc":0,"stem":"评审委员会推荐成交候选供应商应当排序，供应商报价相同的，成交候选供应商并列。（　）","opts":[],"ans":"√","exp":"竞争性谈判、询价均按报价由低到高排序。","law":""},{"id":"add2b-005","t":"tf","ch":2,"mod":"M2","d":4,"kp":"2-16","kpn":"竞争性谈判程序","sc":0,"stem":"竞争性谈判中，谈判小组可以根据谈判情况实质性变动谈判文件的技术、服务要求以及合同草案条款，但须经采购人代表确认。（　）","opts":[],"ans":"√","exp":"谈判文件可以实质性变动，但必须经采购人代表确认并以书面形式通知所有参加谈判的供应商，这是谈判区别于招标的重要特征。","law":"财政部令第74号"},{"id":"tf_052","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-16","kpn":"竞争性谈判程序","sc":0,"stem":"竞争性谈判中，谈判顺序应当以现场抽签或者其他能够给予供应商平等机会的方式确定。（　）","opts":[],"ans":"√","exp":"不得按递交文件先后等可能不公的方式确定。","law":""},{"id":"add2-019","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-17","kpn":"竞争性磋商程序","sc":0,"stem":"竞争性磋商采用的是综合评分法，而非最后报价最低者成交。（　）","opts":[],"ans":"√","exp":"这是磋商与谈判的关键区别：谈判按最后报价最低确定成交，磋商按综合评分得分最高确定成交。","law":"财库〔2014〕214号"},{"id":"tf_053","t":"tf","ch":2,"mod":"M2","d":5,"kp":"2-17","kpn":"竞争性磋商程序","sc":0,"stem":"竞争性磋商中，供应商得分且最后报价相同的，按照技术指标优劣顺序推荐。（　）","opts":[],"ans":"√","exp":"排序规则：得分→报价→技术指标→并列。","law":""},{"id":"tf_054","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-19","kpn":"单一来源程序","sc":0,"stem":"单一来源采购商定价格时，专业人员应当要求供应商提供项目成本构成和同类项目合同价格。（　）","opts":[],"ans":"√","exp":"以此判断价格合理性，无法商定的应终止采购。","law":""},{"id":"add2-016","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-21","kpn":"澄清与说明","sc":0,"stem":"评审过程中，评审委员会可以要求供应商对其响应文件进行澄清，澄清时可以改变响应文件的实质性内容。（　）","opts":[],"ans":"×","exp":"澄清、说明或补正不得改变响应文件的实质性内容，且应当以书面形式进行。","law":"财政部令第87号、第74号"},{"id":"tf_045","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-21","kpn":"澄清与说明","sc":0,"stem":"采购组织单位对采购文件的书面解释，可以根据评审需要适当改变采购文件的原义。（　）","opts":[],"ans":"×","exp":"解释不得改变采购文件原义，不得影响公平公正。","law":""},{"id":"tf_046","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-21","kpn":"澄清与说明","sc":0,"stem":"评审委员会要求供应商澄清、说明或者更正，不得超出投标（响应）文件的范围。（　）","opts":[],"ans":"√","exp":"也不得借此让供应商实质改变响应文件内容。","law":""},{"id":"tf_047","t":"tf","ch":2,"mod":"M2","d":5,"kp":"2-21","kpn":"澄清与说明","sc":0,"stem":"单价汇总金额比总价金额高，且超过采购预算或者最高限价的，应当作无效投标处理。（　）","opts":[],"ans":"√","exp":"未超过预算或最高限价的，以单价汇总金额作为价格评分依据。","law":""},{"id":"tf_064","t":"tf","ch":2,"mod":"M2","d":2,"kp":"2-22","kpn":"废标情形","sc":0,"stem":"招标采购中，对招标文件作实质响应的供应商不足三家的，应当废标。（　）","opts":[],"ans":"√","exp":"《政府采购法》第三十六条规定的废标情形之一。","law":""},{"id":"add2-013","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-23","kpn":"终止采购","sc":0,"stem":"招标项目废标后，采购人可以直接改用竞争性谈判方式重新采购。（　）","opts":[],"ans":"×","exp":"废标后应重新组织招标；需要改用其他采购方式的，须依法报设区的市、自治州以上财政部门批准。","law":"政府采购法第37条、财政部令第74号第4条"},{"id":"add2-015","t":"tf","ch":2,"mod":"M2","d":2,"kp":"2-24","kpn":"重新评审","sc":0,"stem":"评审委员会发现评分汇总有误，可以自行决定重新评审并直接修改评审结果。（　）","opts":[],"ans":"×","exp":"重新评审须依法定情形启动，并书面报告本级财政部门，不能由评审委员会自行决定并直接修改结果。","law":"政府采购法实施条例第44条"},{"id":"tf_049","t":"tf","ch":2,"mod":"M2","d":4,"kp":"2-24","kpn":"重新评审","sc":0,"stem":"采购组织单位现场复核发现分值汇总计算错误的，应当书面建议评审委员会现场修改评审结果或者重新评审。（　）","opts":[],"ans":"√","exp":"采纳与否由评审委员会自主决定。","law":""},{"id":"tf_050","t":"tf","ch":2,"mod":"M2","d":5,"kp":"2-24","kpn":"重新评审","sc":0,"stem":"评审委员会不采纳采购组织单位书面建议的，采购组织单位可以擅自中止采购活动。（　）","opts":[],"ans":"×","exp":"不得擅自中止，认为结果不合法的应书面报告同级财政部门。","law":""},{"id":"add2b-004","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-25","kpn":"评审报告","sc":0,"stem":"评审委员会成员名单在中标、成交结果公告前应当保密。（　）","opts":[],"ans":"√","exp":"评审专家名单在结果公告前应当保密，财政部门、采购人和采购代理机构工作人员不得泄露专家个人情况。","law":"财库〔2016〕198号"},{"id":"add2-024","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-26","kpn":"争议处理","sc":0,"stem":"评审委员会对需要共同认定的事项存在争议的，按照少数服从多数的原则作出结论；持异议的成员应当在评审报告上签署不同意见并说明理由。（　）","opts":[],"ans":"√","exp":"少数服从多数是法定原则；持异议又不签署意见的，视为同意评审结论。","law":"财库〔2016〕198号第19条"},{"id":"add2-025","t":"tf","ch":2,"mod":"M2","d":2,"kp":"2-29","kpn":"履约验收实务","sc":0,"stem":"政府采购项目的履约验收由供应商自行组织，采购人只需在验收书上盖章确认。（　）","opts":[],"ans":"×","exp":"履约验收由采购人或者其委托的采购代理机构组织，大型或复杂项目应邀请第三方参加，验收书是付款依据。","law":"政府采购法第41条"},{"id":"add2b-007","t":"tf","ch":2,"mod":"M2","d":2,"kp":"2-29","kpn":"履约验收实务","sc":0,"stem":"履约验收书是采购人向供应商支付采购资金的依据之一。（　）","opts":[],"ans":"√","exp":"验收合格后应按合同约定及时支付；验收书是付款的必备依据，也是履约管理的核心凭证。","law":"政府采购法第41条"},{"id":"add2-029","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-31","kpn":"异常低价审查","sc":0,"stem":"供应商对异常低价的书面说明不能合理说明其报价合理性的，评审委员会应当认定其响应无效。（　）","opts":[],"ans":"√","exp":"异常低价审查应先要求说明并提供证明材料；说明不合理的，作无效响应处理；但不得未经说明程序直接否决。","law":"财政部关于推动解决政府采购异常低价问题的通知"},{"id":"tf_048","t":"tf","ch":2,"mod":"M2","d":4,"kp":"2-31","kpn":"异常低价审查","sc":0,"stem":"供应商报价低于采购预算50%的，评审委员会应当要求其提供成本构成书面说明。（　）","opts":[],"ans":"√","exp":"另一触发条件是低于其他有效供应商报价算术平均价的40%。","law":""},{"id":"tf_055","t":"tf","ch":2,"mod":"M2","d":3,"kp":"2-32","kpn":"评审现场纪律","sc":0,"stem":"评审现场应当实现物理分离，评审委员会成员在相对集中的前提下进行有效物理隔离。（　）","opts":[],"ans":"√","exp":"同时应实现评审过程电子化和电子监控存档。","law":""},{"id":"add2-030","t":"tf","ch":2,"mod":"M2","d":3,"kp":"4-13","kpn":"四川评审工作规程","sc":1,"stem":"按四川省政府采购评审工作规程，评审委员会成员在评审前应当集中熟悉采购文件，并推选产生评审委员会组长。（　）","opts":[],"ans":"√","exp":"评审前准备包括宣布评审纪律、集中保管通讯工具、熟悉采购文件、推选组长等环节。","law":"《四川省政府采购评审工作规程（修订）》"},{"id":"add2b-008","t":"tf","ch":2,"mod":"M2","d":3,"kp":"4-13","kpn":"四川评审工作规程","sc":1,"stem":"按四川省政府采购评审工作规程，评审现场应当实行物理隔离，评审委员会成员不得擅自离开评审区域。（　）","opts":[],"ans":"√","exp":"四川评审规程要求评审区域物理隔离、人员进出登记、通讯工具集中保管，防止评审信息外泄和外界干预。","law":"《四川省政府采购评审工作规程（修订）》"},{"id":"add1-039","t":"tf","ch":2,"mod":"M2","d":2,"kp":"4-16","kpn":"一体化平台","sc":1,"stem":"四川省政府采购一体化平台支持评审专家抽取、使用、管理的全流程电子化。（　）","opts":[],"ans":"√","exp":"四川评审专家库已整体迁移至政府采购一体化平台，实现抽取、使用、管理全流程电子化。","law":"《四川省政府采购一体化平台管理暂行办法》"},{"id":"add2b-009","t":"tf","ch":2,"mod":"M2","d":2,"kp":"4-16","kpn":"一体化平台","sc":1,"stem":"四川省政府采购项目实行全流程电子化采购的，电子签章与纸质签章具有同等法律效力。（　）","opts":[],"ans":"√","exp":"四川电子化采购管理办法明确电子签章、电子档案的法律效力，电子采购文件免费提供。","law":"《四川省政府采购项目电子化采购管理办法》"},{"id":"add2b-010","t":"tf","ch":2,"mod":"M2","d":3,"kp":"4-18","kpn":"采购人主体责任","sc":1,"stem":"按四川省采购人主体责任清单，采购人应当对采购需求的合法性、合规性和合理性负责。（　）","opts":[],"ans":"√","exp":"采购人是采购需求管理的第一责任人，应对需求调查、需求确定及履约验收全过程负责，不得将责任转嫁给代理机构或评审委员会。","law":"《四川省政府采购项目采购人主体责任清单（2025年版）》"},{"id":"add2-034","t":"tf","ch":2,"mod":"M2","d":3,"kp":"4-19","kpn":"工程类项目","sc":1,"stem":"四川省政府采购工程项目，采用非招标方式采购的，应当按政府采购法体系执行，并依法履行审批程序。（　）","opts":[],"ans":"√","exp":"政府采购工程采用招标方式的适用招标投标法；采用竞争性谈判、磋商、单一来源等非招标方式的，适用政府采购法体系并须审批。","law":"政府采购法实施条例第7条、四川省工程采购通知"},{"id":"add2-035","t":"tf","ch":2,"mod":"M2","d":3,"kp":"4-20","kpn":"框架协议四川细则","sc":1,"stem":"四川省框架协议采购由省级统一组织征集，市县不再重复征集。（　）","opts":[],"ans":"√","exp":"四川对框架协议采购实行全省统一征集、分级使用，避免重复征集、标准不一。","law":"四川省财政厅关于规范和加强框架协议采购管理工作的通知"},{"id":"tf_028","t":"tf","ch":3,"mod":"M3","d":1,"kp":"3-02","kpn":"专家义务","sc":0,"stem":"评审专家应当配合答复供应商的询问、质疑和投诉等事项。（　）","opts":[],"ans":"√","exp":"这是法定义务，拒不履行将被记入不良行为记录。","law":""},{"id":"tf_031","t":"tf","ch":3,"mod":"M3","d":1,"kp":"3-03","kpn":"独立评审","sc":0,"stem":"对需要专业判断的主观评审因素，评审委员会成员可以协商后统一评分。（　）","opts":[],"ans":"×","exp":"主观评审因素必须独立评分，协商评分属禁止行为。","law":""},{"id":"tf_036","t":"tf","ch":3,"mod":"M3","d":5,"kp":"3-04","kpn":"回避制度","sc":0,"stem":"评审专家与供应商存在利害关系未回避的，处2000元以上2万元以下罚款。（　）","opts":[],"ans":"×","exp":"未回避直接处2万元以上5万元以下罚款，并禁止参加评审活动。","law":""},{"id":"tf_073","t":"tf","ch":3,"mod":"M3","d":3,"kp":"3-05","kpn":"本单位项目限制","sc":0,"stem":"评审专家对本单位的政府采购项目，可以作为评审专家参加该项目的评审。（　）","opts":[],"ans":"×","exp":"评审专家对本单位政府采购项目只能作为采购人代表参与评审，不得以评审专家身份参加。","law":""},{"id":"tf_033","t":"tf","ch":3,"mod":"M3","d":3,"kp":"3-09","kpn":"保密义务","sc":0,"stem":"评审结束后，评审专家可以将评审资料复制带走，用于本单位业务学习。（　）","opts":[],"ans":"×","exp":"不得记录、复制或者带走任何评审资料。","law":""},{"id":"tf_063","t":"tf","ch":3,"mod":"M3","d":2,"kp":"3-09","kpn":"保密义务","sc":0,"stem":"评审专家参加评审，可以携带手机进入评审区，但须调至静音。（　）","opts":[],"ans":"×","exp":"通讯工具及相关电子设备须交采购组织单位统一保管，不得带入评审区。","law":""},{"id":"tf_030","t":"tf","ch":3,"mod":"M3","d":3,"kp":"3-10","kpn":"禁止私下接触","sc":0,"stem":"评审过程中因发生不可预见情况确需与外界联系的，可以在监督人员监督之下办理。（　）","opts":[],"ans":"√","exp":"原则是不得与外界联系，例外须受监督。","law":""},{"id":"tf_025","t":"tf","ch":3,"mod":"M3","d":3,"kp":"3-12","kpn":"禁止串通","sc":0,"stem":"评审专家可以建立或者加入评审专家微信群，用于日常交流评审项目情况。（　）","opts":[],"ans":"×","exp":"不得建立或加入存在操控评审情形的社交平台和网络通讯群。","law":""},{"id":"tf_029","t":"tf","ch":3,"mod" const store={get(k,d){try{const v=localStorage.getItem('zcp_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('zcp_'+k,JSON.stringify(v))}catch(e){}}};

let rnd=Math.random;
function seedRand(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  const byMod={};let sc=0;
  BANK.forEach(q=>{byMod[q.mod]=(byMod[q.mod]||0)+1;if(q.sc===1)sc++});
  return {total:BANK.length,byMod,sc,kp:Object.keys(KP).length};
}

let curLevel=3, curMods=['M1','M2','M3'];
function bindComposeEvents(){
  document.querySelectorAll('.lv').forEach(el=>el.onclick=()=>{
    document.querySelectorAll('.lv').forEach(x=>x.classList.remove('on'));
    el.classList.add('on');curLevel=+el.dataset.lv;
  });
  document.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{
    el.classList.toggle('on');
    curMods=[...document.querySelectorAll('.chip.on')].map(x=>'M'+x.dataset.ch);
  });
  Object.keys(TYPES).forEach(t=>{
    const inp=$('t_'+t);if(!inp)return;
    inp.oninput=()=>updateTotal();
  });
}
function updateTotal(){
  let cnt=0,score=0;
  Object.entries(TYPES).forEach(([t,cfg])=>{
    const n=+($('t_'+t)?.value||0);cnt+=n;score+=n*cfg.per;
  });
  $('sumCount').textContent=cnt;$('sumScore').textContent=score;
}

// ---------- 跨卷去重 ----------
function recentUsedIds(){
  const rec=store.get('recent',[]);const s=new Set();
  rec.forEach(p=>(p.ids||[]).forEach(id=>s.add(id)));return s;
}

// ---------- 组卷算法 ----------
function targetDiffDist(L){
  const t={1:[.60,.30,.10,0,0],2:[.15,.60,.20,.05,0],3:[0,.10,.60,.25,.05],4:[0,.05,.25,.50,.20],5:[0,0,.15,.35,.50]};
  return t[L]||t[3];
}
function distributeByWeight(n,mods){
  const totalWt=mods.reduce((s,m)=>s+WT[m[1]],0);
  const quota={};let sum=0;
  mods.forEach(m=>{quota[m]=Math.round(n*WT[m[1]]/totalWt);sum+=quota[m]});
  let i=0;while(sum!==n){const m=mods[i%mods.length];if(sum<n){quota[m]++;sum++}else if(quota[m]>0){quota[m]--;sum--}i++}
  return quota;
}
function genPaper(params){
  const usedIds=recentUsedIds();
  const pool=BANK.filter(q=>!usedIds.has(q.id));
  const mods=params.mods, diffDist=targetDiffDist(params.level);
  const items=[];
  for(const t of ['single','multi','tf']){
    const need=params.types[t]||0;if(!need)continue;
    const tp=pool.filter(q=>q.t===t);
    let picked=[];
    if(params.strategy==='random'){
      picked=shuffle(tp).slice(0,need);
    }else{
      let wantD={};for(let d=1;d<=5;d++)wantD[d]=Math.round(need*diffDist[d-1]);
      if(params.strategy==='focus'){wantD={1:0,2:Math.round(need*.05),3:Math.round(need*.2),4:Math.round(need*.45),5:Math.round(need*.3)}}
      let ssum=Object.values(wantD).reduce((a,b)=>a+b,0);
      while(ssum!==need){if(ssum<need){for(let d=5;d>=1;d--){wantD[d]++;ssum++;break}}else{for(let d=5;d>=1;d--){if(wantD[d]>0){wantD[d]--;ssum--;break}}}}
      for(let d=1;d<=5;d++){
        const n=wantD[d];if(n<=0)continue;
        const cand=shuffle(tp.filter(q=>q.d===d));
        const quota=distributeByWeight(n,mods);
        for(const m of mods)picked.push(...cand.filter(q=>q.mod===m).slice(0,quota[m]));
      }
      if(picked.length<need){const have=new Set(picked.map(q=>q.id));for(const q of shuffle(tp)){if(picked.length>=need)break;if(!have.has(q.id))picked.push(q)}}
    }
    picked=picked.slice(0,need);
    items.push(...picked);
  }
  // 四川专项 >=20% (替换时保持题型不变)
  const scNeed=params.scMin?Math.ceil(items.length*SCMIN):0;
  let scCount=items.filter(q=>q.sc===1).length;
  if(scCount<scNeed){
    const scByType={};
    pool.filter(q=>q.sc===1).forEach(q=>{(scByType[q.t]=scByType[q.t]||[]).push(q)});
    for(let i=0;i<items.length&&scCount<scNeed;i++){
      if(items[i].sc!==1){
        const list=scByType[items[i].t]||[];
        const repl=list.find(q=>!items.some(x=>x.id===q.id));
        if(repl){items[i]=repl;scCount++;}
      }
    }
  }
  // 选项乱序 + 顺序整理
  const out=[];const order=['single','multi','tf'];
  order.forEach(t=>items.filter(q=>q.t===t).forEach(q=>out.push(prepare(q,out.length+1))));
  const paper={id:'p'+Date.now(),name:params.name||'模拟试卷',duration:+params.duration,level:params.level,
    strategy:params.strategy,items:out,ids:out.map(x=>x.id),createdAt:Date.now()};
  const rec=store.get('recent',[]);
  rec.unshift({id:paper.id,name:paper.name,ids:paper.ids,time:paper.createdAt});
  store.set('recent',rec.slice(0,2));
  return paper;
}
function prepare(q,no){
  const opts=[],ans=[];
  if(q.t==='tf'){opts.push(['√','正确'],['×','错误']);ans.push(q.ans)}
  else{
    const src=q.opts.map(o=>o.slice());
    shuffle(src);
    const correct=new Set(q.ans.split(''));
    src.forEach((o,i)=>{opts.push([ALPH[i],o[1]]);if(correct.has(o[0]))ans.push(ALPH[i])});
    ans.sort();
  }
  return {id:q.id,no,type:q.t,mod:q.mod,d:q.d,kp:q.kp,kpn:q.kpn,sc:q.sc,stem:q.stem,opts:opts,ans:ans.join(''),exp:q.exp,law:q.law};
}

// ---------- 视图切换 ----------
function showView(name){
  ['Compose','Paper','Answer','Wrong'].forEach(v=>$('view'+v).style.display=v===name?'block':'none');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===(name==='Compose'||name==='Wrong'?(name==='Compose'?'compose':'wrong'):(t.dataset.tab))));
  renderBottomBar(name);
}
function renderBottomBar(view){
  const b=$('bottomBar');
  if(view==='Compose'){b.innerHTML='';return}
  if(view==='Paper'){
    b.innerHTML=`<button class="btn btn-soft" id="bbBack">返回组卷</button><button class="btn btn-primary" id="bbAnswer">开始在线答题</button>`;
    $('bbBack').onclick=()=>showView('Compose');
    $('bbAnswer').onclick=()=>startAnswer();
    return;
  }
  if(view==='Answer'){
    b.innerHTML=`<button class="btn btn-soft" id="bbShow">显示答案</button><button class="btn btn-primary" id="bbSubmit">交卷评分</button>`;
    $('bbShow').onclick=()=>toggleAnswers(true);
    $('bbSubmit').onclick=()=>submitAnswer();
    return;
  }
  b.innerHTML='';
}

// ---------- 试卷页 ----------
function renderPaper(){
  const p=curPaper;
  const toolbar=$('paperToolbar');
  toolbar.innerHTML=`<button class="btn btn-soft" data-a="show">显示答案</button><button class="btn btn-soft" data-a="regen">换一套</button><button class="btn btn-soft" data-a="share">分享</button><button class="btn btn-soft" data-a="word">导出 Word</button><button class="btn btn-soft" data-a="print">打印 / PDF</button><button class="btn btn-primary" data-a="answer">开始在线答题</button>`;
  toolbar.querySelectorAll('.btn').forEach(b=>b.onclick=()=>paperAction(b.dataset.a));
  const body=$('paperBody');
  const secNames={single:'一、单项选择题',multi:'二、多项选择题',tf:'三、判断题'};
  const typeTip={single:'每题只有一个正确选项',multi:'每题有两个或两个以上正确选项',tf:'正确填「√」，错误填「×」'};
  let html=`<div class="p-head"><div class="p-title">${esc(p.name)}</div><div class="p-meta">共 ${p.items.length} 题 · 满分 ${p.items.length*2} 分 · 考试时长 ${p.duration} 分钟</div></div>`;
  let lastType='';
  p.items.forEach(q=>{
    if(q.type!==lastType){
      lastType=q.type;
      html+=`<div style="font-weight:700;font-size:15px;margin:14px 0 8px">${secNames[q.type]||''}（${typeTip[q.type]}）</div>`;
    }
    html+=`<div class="q"><div class="q-stem">${q.no}. ${esc(q.stem)}</div><div class="q-opts">`;
    q.opts.forEach(o=>{html+=`<div>${o[0]}. ${esc(o[1])}</div>`});
    html+=`</div></div>`;
  });
  body.innerHTML=html;
  showView('Paper');
}
function paperAction(a){
  if(a==='show')showAnswersInline();
  else if(a==='regen'){curPaper=genPaper(readParams());renderPaper()}
  else if(a==='share')sharePaper();
  else if(a==='word')exportWord();
  else if(a==='print')window.print();
  else if(a==='answer')startAnswer();
}
function showAnswersInline(){
  let html=$('paperBody').innerHTML;
  curPaper.items.forEach(q=>{
    const ansTxt=q.type==='tf'?q.ans:(q.ans.split('').map(k=>{const o=q.opts.find(x=>x[0]===k);return o?k+'.'+o[1]:k}).join('　'));
    html=html.replace(`<div class="q-stem">${q.no}. `,`<div class="q-stem">${q.no}. `);
  });
  // 简单方式: 在每道题后追加答案
  const body=$('paperBody');
  let h=body.innerHTML;
  h=h.replace(/<div class="q"><div class="q-stem">(\d+)\./g,(m,no)=>{
    const q=curPaper.items.find(x=>x.no===+no);
    const ansTxt=q.type==='tf'?q.ans:q.ans;
    return `<div class="q"><div class="q-stem">${no}.`;
  });
  // 用更直接的方式: 重建带答案的版本
  renderPaperWithAnswers();
}
function renderPaperWithAnswers(){
  const p=curPaper;const body=$('paperBody');
  const secNames={single:'一、单项选择题',multi:'二、多项选择题',tf:'三、判断题'};
  let html=`<div class="p-head"><div class="p-title">${esc(p.name)}（含答案与解析）</div><div class="p-meta">共 ${p.items.length} 题</div></div>`;
  let lastType='';
  p.items.forEach(q=>{
    if(q.type!==lastType){lastType=q.type;html+=`<div style="font-weight:700;font-size:15px;margin:14px 0 8px">${secNames[q.type]||''}</div>`}
    html+=`<div class="q"><div class="q-stem">${q.no}. ${esc(q.stem)}</div><div class="q-opts">`;
    q.opts.forEach(o=>{html+=`<div>${o[0]}. ${esc(o[1])}</div>`});
    html+=`</div><div style="margin-top:5px;font-size:13px"><b style="color:var(--green)">答案：${esc(q.ans)}</b>　<span style="color:#4b5563">${esc(q.exp)}</span>${q.law?`　<span style="color:#9ca3af">📖 ${esc(q.law)}</span>`:''}</div></div>`;
  });
  body.innerHTML=html;
}
function exportWord(){
  let html='<html><head><meta charset="UTF-8"></head><body style="font-family:宋体">';
  html+=`<h2 style="text-align:center">${esc(curPaper.name)}</h2>`;
  const secNames={single:'一、单项选择题',multi:'二、多项选择题',tf:'三、判断题'};
  let lastType='';
  curPaper.items.forEach(q=>{
    if(q.type!==lastType){lastType=q.type;html+=`<h3>${secNames[q.type]||''}</h3>`}
    html+=`<p><b>${q.no}.</b> ${esc(q.stem)}</p><p>`;
    q.opts.forEach(o=>{html+=`${o[0]}. ${esc(o[1])}&nbsp;&nbsp;`});
    html+=`</p><p style="color:#666">答案：${esc(q.ans)}　解析：${esc(q.exp)}</p>`;
  });
  html+='</body></html>';
  download(esc(curPaper.name)+'.doc',html,'application/msword');
}
function download(name,content,mime){
  const blob=new Blob(['\ufeff'+content],{type:mime});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);
}
function sharePaper(){
  const params=readParams();
  const code=btoa(unescape(encodeURIComponent(JSON.stringify({p:params,seed:Math.floor(Math.random()*1e9)}))));
  const url=location.origin+location.pathname+'#share='+code;
  showShareBox(url);
}
function showShareBox(url){
  $('paperBody').innerHTML=`<div class="share-box"><h2 style="font-size:16px">分享这套试卷</h2>`+
    `<p style="font-size:13px;color:var(--muted)">链接已内含组卷参数，他人打开即得到同一套试卷（微信可直接打开）</p>`+
    `<div class="link" id="shareLink">${esc(url)}</div>`+
    `<button class="btn btn-primary btn-block" id="btnCopy">复制链接</button>`+
    `<p style="font-size:12px;color:var(--muted);margin-top:10px">注：离线单文件下分享链接仅本机可用；部署到线上后即全网可开。</p></div>`;
  $('btnCopy').onclick=()=>{navigator.clipboard?.writeText(url).then(()=>alert('已复制'))};
}

// ---------- 答题 ----------
function startAnswer(){
  submitted=false;
  clearInterval(curTimerId);
  const body=$('answerBody');
  const N=curPaper.items.length;
  const secNames={single:'一、单项选择题',multi:'二、多项选择题',tf:'三、判断题'};
  const typeTip={single:'每题只有一个正确选项',multi:'每题有两个或两个以上正确选项',tf:'正确填「√」，错误填「×」'};
  let html=`<div class="ans-header"><h1>四川省政府采购评审专家考试 · ${esc(curPaper.name)}</h1><div class="meta"><span>📝 <b>${N} 题</b></span><span>💯 <b>满分 ${N*2} 分</b></span><span>⏱ 建议 <b>${curPaper.duration} 分钟</b></span><span>🔥 难度 ${LV[curPaper.level]||''}</span></div></div>`;
  let lastType='';
  curPaper.items.forEach(q=>{
    if(q.type!==lastType){
      lastType=q.type;
      html+=`<div class="sec-h">${secNames[q.type]||''} <span class="tip">（${typeTip[q.type]||''}）</span></div>`;
    }
    const inputType=(q.type==='multi')?'checkbox':'radio';
    let optsHtml='';
    q.opts.forEach(o=>{
      optsHtml+=`<label class="opt" data-no="${q.no}" data-key="${o[0]}"><input type="${inputType}" name="q${q.no}" value="${o[0]}"><span class="opt-key">${o[0]}</span><span class="opt-text">${esc(o[1])}</span></label>`;
    });
    html+=`<div class="ans-q" id="aq${q.no}" data-no="${q.no}" data-ans="${q.ans}"><div class="q-head"><span class="q-no">${q.no}</span><span class="badge-type">${TYPES[q.type]?.short||''}</span><span class="q-diff">${LV[q.d]||''}</span>${q.sc?'<span class="badge-sc">川</span>':''}</div><div class="q-stem">${esc(q.stem)}</div><div class="q-opts">${optsHtml}</div><div class="q-ans" id="qans${q.no}"></div></div>`;
  });
  body.innerHTML=html;
  body.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    const no=o.dataset.no;const input=o.querySelector('input');
    if(input.type==='radio'){body.querySelectorAll(`.opt[data-no="${no}"]`).forEach(g=>g.classList.remove('sel'));o.classList.add('sel')}
    else{input.checked=!input.checked;o.classList.toggle('sel',input.checked)}
  });
  // 计时
  let remain=curPaper.duration*60;
  const tv=$('timerVal'),tm=$('timer');
  const tick=()=>{remain--;const m=Math.floor(remain/60),s=remain%60;tv.textContent=`${m}:${String(s).padStart(2,'0')}`;tm.classList.toggle('warn',remain<=300);if(remain<=0){clearInterval(curTimerId);submitAnswer()}};
  tick();curTimerId=setInterval(tick,1000);
  $('result').style.display='none';
  showView('Answer');
  window.scrollTo(0,0);
}
function answerStr(no){
  const keys=[];document.querySelectorAll(`.opt[data-no="${no}"] input:checked`).forEach(i=>keys.push(i.value));
  keys.sort();return keys.join('');
}
function toggleAnswers(show){
  document.querySelectorAll('.q-ans').forEach(el=>el.style.display=show?'block':'none');
}
function submitAnswer(){
  if(submitted)return;submitted=true;
  clearInterval(curTimerId);
  let correct=0,wrong=0,blank=0;
  const wrongList=[];
  curPaper.items.forEach(q=>{
    const real=q.ans,got=answerStr(q.no),ok=got===real;
    if(!got)blank++;else if(ok)correct++;else wrong++;
    document.querySelectorAll(`.opt[data-no="${q.no}"]`).forEach(o=>{
      const k=o.dataset.key,isReal=real.indexOf(k)>=0,isGot=o.querySelector('input').checked;
      if(isReal)o.classList.add('correct');if(isGot&&!isReal)o.classList.add('wrong');
    });
    const el=$('qans'+q.no);
    el.innerHTML=`<div class="ans-line"><b>标准答案：${real}</b>　${ok?'✔ 回答正确':(got?'✘ 回答错误（你的答案 '+got+'）':'⏭ 未作答')}</div><div class="exp">💡 解析：${esc(q.exp)}</div>${q.law?`<div class="src">📖 ${esc(q.law)}</div>`:''}`;
    el.style.display='block';
    if(!ok){wrongList.push(q)}
  });
  const score=correct*2;
  const r=$('result');
  r.innerHTML=`<div class="score ${score>=60?'pass':'fail'}">${score}</div><div class="sub">${score>=60?'成绩合格（60 分及以上）':'未达合格线（60 分）'} · 满分 ${curPaper.items.length*2} 分</div><div class="bd"><span>✅ 答对 <b>${correct}</b></span><span>❌ 答错 <b>${wrong}</b></span><span>⏭ 未答 <b>${blank}</b></span></div>`;
  r.style.display='block';
  // 错题入库
  const wb=store.get('wrong',[]);
  wrongList.forEach(q=>{
    const exist=wb.find(w=>w.id===q.id);
    if(exist){exist.times++;exist.lastAns=answerStr(q.no);exist.updated=Date.now()}
    else wb.push({id:q.id,type:q.type,mod:q.mod,kpn:q.kpn,d:q.d,stem:q.stem,opts:q.opts,ans:q.ans,exp:q.exp,law:q.law,times:1,lastAns:answerStr(q.no),updated:Date.now()});
  });
  // 做对的自动移出
  const correctIds=new Set(curPaper.items.filter(q=>answerStr(q.no)===q.ans).map(q=>q.id));
  store.set('wrong',wb.filter(w=>!correctIds.has(w.id)));
  r.scrollIntoView({behavior:'smooth'});
}

// ---------- 错题本 ----------
function renderWrongFilter(){
  $('wbFilter').innerHTML=
    `<select id="wfType"><option value="">全部题型</option>${Object.entries(TYPES).map(([t,c])=>`<option value="${t}">${c.name}</option>`).join('')}</select>`+
    `<select id="wfMod"><option value="">全部模块</option>${Object.entries(CH).map(([ch,nm])=>`<option value="M${ch}">${nm}</option>`).join('')}</select>`+
    `<select id="wfSort"><option value="recent">最近出错优先</option><option value="times">错得最多优先</option><option value="kp">按考点排序</option></select>`;
  ['wfType','wfMod','wfSort'].forEach(id=>$(id).onchange=renderWrongList);
}
function renderWrongList(){
  let wb=store.get('wrong',[]);
  const t=$('wfType')?.value,m=$('wfMod')?.value,s=$('wfSort')?.value;
  if(t)wb=wb.filter(w=>w.type===t);
  if(m)wb=wb.filter(w=>w.mod===m);
  if(s==='recent')wb.sort((a,b)=>b.updated-a.updated);
  else if(s==='times')wb.sort((a,b)=>b.times-a.times);
  else if(s==='kp')wb.sort((a,b)=>(a.kpn||'').localeCompare(b.kpn||''));
  const box=$('wbList');
  if(!wb.length){box.innerHTML=`<div class="empty">暂无错题${t||m?'（当前筛选下）':''}</div>`;return}
  box.innerHTML=wb.map(w=>{
    const opts=w.type==='tf'?'':w.opts.map(o=>`${o[0]}. ${esc(o[1])}`).join('　');
    return `<div class="wb-item"><div class="meta"><span>错 <b>${w.times}</b> 次</span><span>${TYPES[w.type]?.short||w.type}</span><span>${w.kpn||''}</span><span>难度 ${LV[w.d]||w.d}</span></div>`+
      `<div style="font-size:14px">${esc(w.stem)}</div>`+
      (opts?`<div style="font-size:13px;color:#4b5563;margin-top:4px">${opts}</div>`:'')+
      `<div style="font-size:13px;margin-top:5px"><b style="color:var(--green)">答案：${esc(w.ans)}</b>${w.lastAns?`　<span style="color:var(--red)">你上次答：${esc(w.lastAns)}</span>`:''}</div>`+
      `<div style="font-size:12.5px;color:#6b7280;margin-top:3px">💡 ${esc(w.exp)}</div></div>`;
  }).join('');
}
function startWrongRetest(){
  let wb=store.get('wrong',[]);
  if(!wb.length){alert('错题本为空');return}
  // 用错题重练: 生成一张只含错题的答题卷
  const items=wb.map((w,i)=>Object.assign({},w,{no:i+1,type:w.type,sc:0}));
  curPaper={id:'pwb',name:'错题重练',duration:Math.max(15,Math.ceil(items.length*1.5)),level:3,strategy:'balanced',items,ids:items.map(x=>x.id),createdAt:Date.now()};
  startAnswer();
}

// ---------- 分享解码 ----------
function readParams(){
  const types={};Object.entries(TYPES).forEach(([t,c])=>types[t]=+($('t_'+t)?.value||c.def));
  return {name:$('fName')?.value||'',duration:$('fDuration')?.value||90,strategy:$('fStrategy')?.value||'balanced',
    types,level:curLevel,mods:curMods,scMin:$('fSC')?.checked!==false};
}
function applyParams(params){
  if(params.level)curLevel=params.level;
  if(params.mods)curMods=params.mods;
  if(params.strategy)$('fStrategy').value=params.strategy;
  if(params.duration)$('fDuration').value=String(params.duration);
  if(params.name)$('fName').value=params.name;
  if(params.types){Object.entries(params.types).forEach(([t,n])=>{const inp=$('t_'+t);if(inp)inp.value=n})}
  document.querySelectorAll('.lv').forEach(x=>x.classList.toggle('on',+x.dataset.lv===curLevel));
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',curMods.includes('M'+x.dataset.ch)));
  updateTotal();
}

// ---------- 初始化 ----------
function init(){
  renderHeadMeta();
  renderTypeRows();
  renderWrongFilter();
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    const v=t.dataset.tab==='compose'?'Compose':'Wrong';
    showView(v);if(v==='Wrong')renderWrongList();
  });
  $('btnGen').onclick=()=>{
    const params=readParams();
    if(!params.mods.length){alert('请至少选择一个考试模块');return}
    if(Object.values(params.types).reduce((a,b)=>a+b,0)<=0){alert('请至少设置一道题');return}
    curPaper=genPaper(params);
    renderPaper();
  };
  // 分享链接解码
  const m=location.hash.match(/share=([A-Za-z0-9+/=]+)/);
  if(m){try{
    const obj=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(obj.p)applyParams(obj.p);
    if(obj.seed)rnd=seedRand(obj.seed);
    if(obj.p){curPaper=genPaper(obj.p);renderPaper()}
  }catch(e){}}
}
init();
